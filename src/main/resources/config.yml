# ==========================================================
# MDVGraves 1.0.6 - Bolsas de muerte ligeras para MDVCRAFT
# ==========================================================
settings:
  enabled: true

  # Solo en estos mundos se crean bolsas. En los demás, muerte vanilla normal.
  enabled-worlds:
    - world

  # 7 días mientras nadie la haya abierto.
  unopened-expire-hours: 168

  # Desde la primera apertura, quedan 20 minutos.
  opened-expire-minutes: 20

  # Una consulta SQLite por intervalo. No revisa tumbas por tick.
  cleanup-interval-seconds: 300

  # Si no puede colocar una cabeza de forma segura, deja los drops vanilla.
  placement-search-radius: 2

  remove-when-empty: true
  # true: una explosión que alcance la bolsa la rompe y suelta su contenido normal.
  # false: las bolsas son inmunes a explosiones.
  explosions-break-graves: true
  protect-from-pistons: true
  protect-from-fluids: true

  # Las bolsas son una excepción intencional a las protecciones de región:
  # cualquier jugador puede abrirlas y romperlas para conservar el loot PvP.

  # Cualquier jugador puede abrir o romper cualquier bolsa.
  only-owner-can-open: false

  # Al romperla, su contenido cae una sola vez como drops normales.
  break-drops-items: true

  # Evita dos inventarios simultáneos sobre la misma bolsa.
  single-viewer-lock: true

# ==========================================================
# UTILIDADES POR PERMISO
# ==========================================================
utilities:
  back-grave:
    enabled: true

    # Permite también usar /back grave sin reemplazar el /back de Essentials.
    intercept-back-grave: true

    # 0 desactiva el cooldown.
    cooldown-seconds: 30

    # Busca un punto seguro alrededor de la última bolsa.
    safe-search-radius: 3

    # Vacío = sin sonido.
    sound: 'entity.enderman.teleport'

  private-graves:
    enabled: true

    # Las bolsas creadas por jugadores con mdvgraves.private
    # tampoco se rompen mediante explosiones.
    protect-from-explosions: true

  keep-inventory:
    enabled: true

inventory:
  title: '&8Bolsa perdida de &e{owner}'
  # Debe ser múltiplo de 9, entre 9 y 54. Si hay más objetos, se ajusta hasta 54.
  minimum-size: 27

textures:
  # Se evalúan de arriba hacia abajo. La primera permission que cumpla gana.
  ranks:
    admin:
      permission: 'mdvgraves.texture.admin'
      texture: ''
    vip:
      permission: 'mdvgraves.texture.vip'
      texture: ''

  # Base64 completo de textures.minecraft.net. Vacío = cabeza de jugador normal.
  default: ''

