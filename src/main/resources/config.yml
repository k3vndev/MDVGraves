  delete-all-confirm: '&cEsto eliminará definitivamente las &e{count} &cbolsas y todo su contenido. Usa &e/mdvgraves deleteall confirm &cpara confirmar.'
  delete-all-done: '&aSe eliminaron definitivamente &e{count} &abolsas.'
